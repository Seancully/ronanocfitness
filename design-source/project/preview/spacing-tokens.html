<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 24px; font-family: var(--font-body); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .title { color: #555; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .bar { background: var(--accent); height: 8px; border-radius: 2px; }
  .label { color: #888; font-size: 11px; display: flex; justify-content: space-between; }
  .sep { width: 100%; height: 1px; background: #1e1e1e; grid-column: 1/-1; }
  .radrow { display: flex; align-items: center; gap: 12px; }
  .rad { background: #1F1F1F; border: 1px solid #2A2A2A; width: 40px; height: 40px; }
</style>
</head><body>
<div class="group">
  <div class="title">Spacing Scale</div>
  <div class="label"><span>space-2</span><span>8px</span></div>
  <div class="bar" style="width:8px"></div>
  <div class="label"><span>space-4</span><span>16px</span></div>
  <div class="bar" style="width:16px"></div>
  <div class="label"><span>space-6</span><span>24px</span></div>
  <div class="bar" style="width:24px"></div>
  <div class="label"><span>space-8</span><span>32px</span></div>
  <div class="bar" style="width:32px"></div>
  <div class="label"><span>space-12</span><span>48px</span></div>
  <div class="bar" style="width:48px"></div>
  <div class="label"><span>space-20</span><span>80px</span></div>
  <div class="bar" style="width:80px"></div>
</div>
<div class="group">
  <div class="title">Border Radius</div>
  <div class="radrow">
    <div class="rad" style="border-radius:0px"></div>
    <div class="label" style="flex-direction:column"><span>radius-none</span><span>0px</span></div>
  </div>
  <div class="radrow">
    <div class="rad" style="border-radius:2px"></div>
    <div class="label" style="flex-direction:column"><span>radius-sm</span><span>2px</span></div>
  </div>
  <div class="radrow">
    <div class="rad" style="border-radius:4px"></div>
    <div class="label" style="flex-direction:column"><span>radius-md</span><span>4px</span></div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 24px; display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--font-body); }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 100px; height: 64px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.08); }
  .name { color: #888; font-size: 11px; letter-spacing: 0.05em; }
  .hex  { color: #fff; font-size: 12px; font-weight: 600; }
</style>
</head><body>
<div class="swatch"><div class="chip" style="background:#0D0D0D"></div><div class="name">Black</div><div class="hex">#0D0D0D</div></div>
<div class="swatch"><div class="chip" style="background:#1A1A1A"></div><div class="name">Black Soft</div><div class="hex">#1A1A1A</div></div>
<div class="swatch"><div class="chip" style="background:#1F1F1F"></div><div class="name">Card</div><div class="hex">#1F1F1F</div></div>
<div class="swatch"><div class="chip" style="background:#2A2A2A"></div><div class="name">Border</div><div class="hex">#2A2A2A</div></div>
<div class="swatch"><div class="chip" style="background:#D42B2B"></div><div class="name">Red</div><div class="hex">#D42B2B</div></div>
<div class="swatch"><div class="chip" style="background:#B82424"></div><div class="name">Red Hover</div><div class="hex">#B82424</div></div>
<div class="swatch"><div class="chip" style="background:#7A1919"></div><div class="name">Red Muted</div><div class="hex">#7A1919</div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 16px; max-width: 420px; }
  .card { background: #1F1F1F; border: 1px solid #2A2A2A; border-radius: 4px; padding: 20px; }
  .stars { color: #F5C518; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
  .quote { color: #ccc; font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .name  { color: #888; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .faq   { border-bottom: 1px solid #2A2A2A; padding: 16px 0; }
  .faq-q { color: #fff; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
  .faq-a { color: #888; font-size: 14px; line-height: 1.6; margin-top: 10px; }
  .chevron { color: #D42B2B; }
</style>
</head><body>
<div class="card">
  <div class="stars">★★★★★</div>
  <div class="quote">"Working with Ronan has been a game changer. I'm stronger, leaner, and more confident than ever."</div>
  <div class="name">— Sarah M.</div>
</div>
<div style="background:#1F1F1F;border:1px solid #2A2A2A;border-radius:4px;overflow:hidden">
  <div class="faq" style="padding:16px 20px">
    <div class="faq-q">Do I need gym access? <span class="chevron">▼</span></div>
    <div class="faq-a">No — home and gym programmes are both available. I'll build around what you have access to.</div>
  </div>
  <div class="faq" style="padding:16px 20px;border:none">
    <div class="faq-q">How long until I see results? <span class="chevron">▶</span></div>
  </div>
</div>
</body></html>

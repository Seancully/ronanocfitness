<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .label { color: #888; font-size: 11px; width: 110px; }
  .val { color: #fff; font-size: 12px; font-weight: 600; }
  .bar { flex: 1; height: 8px; border-radius: 2px; }
</style>
</head><body>
<div class="row"><div class="dot" style="background:var(--bg-primary); border:1px solid #333"></div><div class="label">bg-primary</div><div class="val">#0D0D0D</div></div>
<div class="row"><div class="dot" style="background:var(--bg-secondary)"></div><div class="label">bg-secondary</div><div class="val">#1A1A1A</div></div>
<div class="row"><div class="dot" style="background:var(--bg-surface)"></div><div class="label">bg-surface</div><div class="val">#1F1F1F</div></div>
<div class="row"><div class="dot" style="background:var(--fg-primary)"></div><div class="label">fg-primary</div><div class="val">#FFFFFF</div></div>
<div class="row"><div class="dot" style="background:var(--fg-secondary)"></div><div class="label">fg-secondary</div><div class="val">#888888</div></div>
<div class="row"><div class="dot" style="background:var(--accent)"></div><div class="label">accent</div><div class="val">#D42B2B</div></div>
<div class="row"><div class="dot" style="background:var(--accent-hover)"></div><div class="label">accent-hover</div><div class="val">#B82424</div></div>
<div class="row"><div class="dot" style="background:var(--border-default)"></div><div class="label">border</div><div class="val">#2A2A2A</div></div>
<div class="row"><div class="dot" style="background:var(--star-color)"></div><div class="label">star</div><div class="val">#F5C518</div></div>
</body></html>

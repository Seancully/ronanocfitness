<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 24px; display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--font-body); }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 100px; height: 64px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.08); }
  .name { color: #888; font-size: 11px; letter-spacing: 0.05em; }
  .hex  { color: #fff; font-size: 12px; font-weight: 600; }
</style>
</head><body>
<div class="swatch"><div class="chip" style="background:#FFFFFF; border:1px solid #333"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
<div class="swatch"><div class="chip" style="background:#F2F2F2; border:1px solid #333"></div><div class="name">Grey 100</div><div class="hex">#F2F2F2</div></div>
<div class="swatch"><div class="chip" style="background:#D0D0D0"></div><div class="name">Grey 300</div><div class="hex">#D0D0D0</div></div>
<div class="swatch"><div class="chip" style="background:#888888"></div><div class="name">Grey 500</div><div class="hex">#888888</div></div>
<div class="swatch"><div class="chip" style="background:#444444"></div><div class="name">Grey 700</div><div class="hex">#444444</div></div>
<div class="swatch"><div class="chip" style="background:#222222"></div><div class="name">Grey 900</div><div class="hex">#222222</div></div>
<div class="swatch"><div class="chip" style="background:#F5C518"></div><div class="name">Gold / Stars</div><div class="hex">#F5C518</div></div>
</body></html>

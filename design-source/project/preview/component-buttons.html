<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 28px 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .meta { color: #555; font-size: 11px; margin-top: 4px; }
  button { cursor: pointer; }
</style>
</head><body>
<div>
  <div class="row">
    <button style="background:#D42B2B;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:14px 32px;border:none;border-radius:0;cursor:pointer;">Start Your Transformation</button>
    <button style="background:#B82424;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:14px 32px;border:none;border-radius:0;cursor:pointer;">Hover State</button>
  </div>
  <div class="meta">Primary Button — bg: #D42B2B / hover: #B82424 / radius: 0</div>
</div>
<div>
  <div class="row">
    <button style="background:transparent;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:13px 31px;border:1px solid #2A2A2A;border-radius:0;cursor:pointer;">Learn More</button>
    <button style="background:transparent;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:13px 31px;border:1px solid #fff;border-radius:0;cursor:pointer;">Hover State</button>
  </div>
  <div class="meta">Secondary Button — transparent / border: 1px solid</div>
</div>
<div>
  <div class="row">
    <button style="background:#D42B2B;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 20px;border:none;border-radius:0;cursor:pointer;">Sign Up</button>
    <button style="background:transparent;color:#888;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:9px 19px;border:1px solid #2A2A2A;border-radius:0;cursor:pointer;opacity:0.5" disabled>Disabled</button>
  </div>
  <div class="meta">Small / Disabled states</div>
</div>
</body></html>

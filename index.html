  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .phone-label { display: none; }

    body[data-theme="light"] { background: #FFFFFF; }

    /* ---- Wide-screen layout ----

    /* Hero: centred stack on phones, copy | media from 900px */
    .hero-grid { width: 100%; max-width: 520px; text-align: center; }

    @media (min-width: 900px) {

        max-width: 1200px;

        grid-template-columns: 1.05fr 1fr;

        align-items: center;
        text-align: left;
      }
      .hero-copy { text-align: left; }
      .hero-lede { margin-left: 0; max-width: 46ch; }
      .hero-media { margin-top: 0; }

    .btn-pill:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .btn-pill:active { transform: translateY(0); }
    .btn-pill:focus-visible { outline: 2px solid #D42B2B; outline-offset: 3px; }
    .btn-pill-lg:hover { box-shadow: 0 10px 26px rgba(212,43,43,0.38); }

    @media (prefers-reduced-motion: reduce) {
      .btn-pill { transition: none; }
      .btn-pill:hover { transform: none; }
    }

    /* Includes + FAQ side by side from tablet up */
    .info-split { display: grid; grid-template-columns: 1fr; gap: 44px; }
    .info-col-head { text-align: center; }
    @media (min-width: 768px) {
      .info-split { grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
      .info-col-head { text-align: left; }
    }

    /* Includes rows */
    .include-row { transition: border-color 0.18s ease, transform 0.18s ease; }
    .include-row:hover { border-color: rgba(212,43,43,0.5); transform: translateX(2px); }

    /* FAQ accordion — 0fr/1fr animates height with no fixed max-height */
    .faq-item { transition: border-color 0.2s ease; }
    .faq-answer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
    .faq-item.is-open .faq-answer { grid-template-rows: 1fr; }
    .faq-chevron { transition: background 0.2s ease, transform 0.28s ease; }
    .faq-item.is-open .faq-chevron { transform: rotate(180deg); }
    .faq-item button:focus-visible { outline: 2px solid #D42B2B; outline-offset: -2px; border-radius: 13px; }

    @media (prefers-reduced-motion: reduce) {
      .include-row, .faq-answer, .faq-chevron, .faq-item { transition: none; }
      .include-row:hover { transform: none; }
    }

    /* Hero proof strip */
    .hero-proof { transition: transform 0.2s ease, border-color 0.2s ease; }
    .hero-proof:hover, .hero-proof:focus-visible {

    .social-wash { transition: opacity 0.22s ease; pointer-events: none; }
    .social-card:hover .social-wash,

    .social-icon { transition: transform 0.22s ease; }

      // Scroll fade-in

        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });

        els.forEach(el => obs.observe(el));

        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: next } }, '*');

            </div>
            <a href={`https://wa.me/353833604182?text=Hi%20Ronan%2C%20I'm%20interested%20in%20your%20coaching%20packages%2C%20can%20you%20send%20me%20more%20information%3F`}

              </div>
            </div>
          )}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

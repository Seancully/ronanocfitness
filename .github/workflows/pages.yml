# Deploy the site to GitHub Pages.
#
# Replaces the legacy branch-based Pages builder, whose deploy step hung in
# `in_progress` for the full 10-minute timeout on two consecutive pushes
# (34MB and 6.7MB payloads alike, so it was the pipeline, not the size).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves everything with Cache-Control: max-age=600, so a
      # returning browser reuses cached .jsx for 10 minutes without even
      # revalidating — you get new HTML running old components. Stamping the
      # commit SHA into each script URL makes every deploy a fresh URL.
      - name: Stamp asset version
        run: |
          sed -i "s/DEPLOY_VERSION/${GITHUB_SHA::8}/g" index.html
          echo "Stamped version ${GITHUB_SHA::8}"
          grep -o 'src="[A-Za-z]*\.jsx?v=[a-f0-9]*"' index.html | head -3

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
